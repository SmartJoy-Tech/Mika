name: Feishu connector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/mika-feishu/**'
      - '.github/workflows/feishu-connector.yml'
  push:
    branches: [tinyfox, 'update/**']
    paths:
      - 'tools/mika-feishu/**'
      - '.github/workflows/feishu-connector.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./tools/mika-feishu
      - run: python -m unittest discover -s tools/mika-feishu/tests -v
